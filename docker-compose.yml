services:
  master:
    build: .
    image: mini-spark:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    working_dir: /app
    command: ["master"]
    environment:
      - MASTER_HOST=0.0.0.0
      - MASTER_PORT=8080
      - WORKER_BASE_PORT=9100
      - DATA_DIR=/app/data
      - RESULT_DIR=/app/results
      - LOG_DIR=/app/logs
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: .
    image: mini-spark:latest
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    working_dir: /app
    command: ["worker"]
    environment:
      - MASTER_HOST=master
      - MASTER_PORT=8080
      - WORKER_ID=worker-1
      - WORKER_THREADS=4
      - WORKER_BIND_HOST=0.0.0.0
      - WORKER_ADVERTISE_HOST=worker
      - DATA_DIR=/app/data
      - RESULT_DIR=/app/results
      - LOG_DIR=/app/logs
    volumes:
      - ./:/app
    depends_on:
      - master
    deploy:
      replicas: 1

  cli:
    build: .
    image: mini-spark:latest
    working_dir: /app
    entrypoint: [""]
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./:/app
    profiles: ["cli"]
